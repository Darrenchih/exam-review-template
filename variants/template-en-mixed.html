<style>
:root,html[data-theme="light"]{
  color-scheme:light;
  --bg:#f4f6f9; --card:#ffffff; --ink:#1c2330; --muted:#68727f;
  --line:#e2e7ee; --accent:#1a6fd4; --accent-d:#155bb0;
  --ok:#1e8e4d; --ok-bg:#e7f6ec; --bad:#c93a3a; --bad-bg:#fdecec;
  --warn:#b7791f; --warn-bg:#fdf3e0; --radius:10px;
  --input-bg:#ffffff; --soft:#fbfcfe; --sel-bg:#eef4fd; --pill-bg:#eef2f7;
  --pill-k-bg:#e3f0ff; --th-bg:#f1f4f8; --track:#e8edf3;
  --note-bg:#fffbe8; --note-line:#ecdfa8;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151c; --card:#1a2130; --ink:#e9edf4; --muted:#b6c0d4;
  --line:#2b3548; --accent:#5f9df2; --accent-d:#82b4f7;
  --ok:#4ade80; --ok-bg:#14291c; --bad:#f08080; --bad-bg:#331b1b;
  --warn:#e3a93e; --warn-bg:#33270f; --radius:10px;
  --input-bg:#222b3d; --soft:#1d2536; --sel-bg:#274268; --pill-bg:#253047;
  --pill-k-bg:#23405f; --th-bg:#1f2940; --track:#2b3548;
  --note-bg:#2d2a17; --note-line:#57501f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
header.top{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line)}
header.top .wrap{max-width:1100px;margin:0 auto;padding:10px 16px}
h1.brand{font-size:18px;margin:0 0 8px}
h1.brand small{color:var(--muted);font-weight:400;font-size:13px;display:block}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
nav.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--soft);color:var(--ink);
  border-radius:999px;padding:9px 16px;font-size:14px;cursor:pointer;min-height:44px}
nav.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:18px 16px 80px}
section.page{display:none}
section.page.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin:0 0 14px}
.card h2{font-size:18px;margin:0 0 10px}
.card h3{font-size:16px;margin:14px 0 8px}
.muted{color:var(--muted)} .small{font-size:13px}
.grid{display:grid;gap:12px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid.c4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
button.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;
  padding:11px 20px;font-size:15px;cursor:pointer;min-height:46px;font-weight:600}
button.btn:hover{background:var(--accent-d)}
button.btn.ghost{background:var(--card);color:var(--accent)}
button.btn.ghost:hover{background:var(--sel-bg)}
button.btn.danger{background:var(--card);color:var(--bad);border-color:var(--bad)}
button.btn.sm{padding:7px 12px;font-size:13px;min-height:38px}
button.btn:disabled{opacity:.45;cursor:default}
.rowbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.kv b{font-weight:600}
.bar{height:10px;background:var(--track);border-radius:99px;overflow:hidden;min-width:90px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar>i.low{background:var(--bad)} .bar>i.mid{background:var(--warn)} .bar>i.high{background:var(--ok)}
.pill{display:inline-block;font-size:12px;border-radius:99px;padding:2px 10px;background:var(--pill-bg);color:var(--muted);margin:2px 4px 2px 0}
.pill.k{background:var(--pill-k-bg);color:var(--accent-d)} .pill.u{background:var(--warn-bg);color:var(--warn)}
.pill.x{background:var(--bad-bg);color:var(--bad)}
.stat-num{font-size:30px;font-weight:700;margin:2px 0}
select,input[type=text],input[type=number]{font-size:15px;padding:10px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--input-bg);color:var(--ink);min-height:46px;width:100%}
option{color:var(--ink);background:var(--input-bg)}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--input-bg);border-radius:8px;
  padding:12px 14px;margin:8px 0;font-size:15px;cursor:pointer;min-height:48px}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--sel-bg)}
.confrow{margin:8px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.confrow button.sel{background:var(--sel-bg);border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default;opacity:1}
.fb{border-radius:8px;padding:14px;margin:12px 0;font-size:15px}
.fb.ok{background:var(--ok-bg);border:1px solid #bfe3cd}
.fb.no{background:var(--bad-bg);border:1px solid #f3c1c1}
.fb h4{margin:0 0 6px;font-size:15px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{border:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--th-bg)}
.flip{background:var(--soft);border:1px dashed var(--line);border-radius:8px;padding:16px;margin:10px 0;cursor:pointer;min-height:70px}
.flip .ans{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.flip.open .ans{display:block}
.flip .hint{color:var(--muted);font-size:13px}
.tree{font-size:14px}
.tree .cat{font-weight:700;margin:14px 0 6px;font-size:15px}
.tree .kp{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);
  border-radius:8px;margin:6px 0;background:var(--card);cursor:pointer;flex-wrap:wrap}
.tree .kp:hover{border-color:var(--accent)}
.tree .kp .nm{flex:1 1 200px}
.tree .kp .meta{font-size:12px;color:var(--muted)}
.ord{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:6px 0;background:var(--card);
  display:flex;align-items:center;gap:8px}
.ord .t{flex:1}
.ord button{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:6px;min-width:40px;min-height:36px;cursor:pointer;font-size:16px}
.matchrow{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
.matchrow .L{flex:1 1 180px;font-weight:600}
.matchrow select{flex:1 1 200px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;
  padding:10px 18px;border-radius:99px;font-size:14px;display:none;z-index:99}
.note{background:var(--note-bg);border:1px solid var(--note-line);border-radius:8px;padding:10px 14px;font-size:13px;margin:10px 0}
details{margin:8px 0} summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.big-q{font-size:17px;font-weight:600;margin:6px 0 10px}
.qmeta{font-size:12px;color:var(--muted);margin-bottom:6px}
.stepdots{font-size:13px;color:var(--muted);margin:8px 0}
footer{max-width:1100px;margin:0 auto;padding:20px 16px 40px;color:var(--muted);font-size:12px}
@media(max-width:640px){ .stat-num{font-size:24px} .card{padding:14px} }
@media (max-width:640px){
  table.t,table.t tbody,table.t tr,table.t td{display:block;width:100%;}
  table.t thead{display:none;}
  table.t tr{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;padding:8px;}
  table.t td{border:none;padding:4px 0;}
  table.t td:before{content:attr(data-label);font-weight:bold;display:block;font-size:12px;color:var(--muted);}
}
@media print{
  header,.tabs,.rowbtns,button,#langbtn,#themebtn{display:none!important;}
  .card{break-inside:avoid;border:1px solid #ccc;box-shadow:none;}
  body{background:#fff;color:#000;}
  .flip .ans{display:block!important;}
}
</style>

<script>
"use strict";
/* ============ 工具 ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function cfm(msg){
  return new Promise(res=>{
    const ov=document.createElement("div");
    ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999";
    ov.innerHTML=`<div class="card" style="max-width:320px;margin:16px"><p>${esc(msg)}</p><div class="rowbtns"><button class="btn" id="cf_y">${T("確定")}</button><button class="btn ghost" id="cf_n">${T("取消")}</button></div></div>`;
    document.body.appendChild(ov);
    ov.querySelector("#cf_y").onclick=()=>{ov.remove();res(true);};
    ov.querySelector("#cf_n").onclick=()=>{ov.remove();res(false);};
    ov.onclick=e=>{if(e.target===ov){ov.remove();res(false);}};
  });
}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",1600);}
function pct(n){return n==null?"—":Math.round(n)+"%";}
function barCls(n){return n==null?"":n>=85?"high":n>=60?"mid":"low";}
/* ============ 分類 ============ */
const DATA_V=1; /* 資料版本 */
/* ============================================================
定義你的科目分類
格式: {id:"唯一英文ID", zh:"中文名稱", en:"English Name"}
============================================================ */
const CATS=[
{id:"cat1",zh:"分類一",en:"Category One"},
{id:"cat2",zh:"分類二",en:"Category Two"},
];
const catName=id=>{const c=CATS.find(c=>c.id===id);if(!c)return id;return LANG==="en"?c.en:c.zh;};
const kpName=k=>LANG==="en"?k.term:`${k.term}（${k.zh}）`;
const kDef=k=>LANG==='en'?(k.def_en||k.def):k.def;
const kFn=k=>LANG==='en'?(k.fn_en||k.fn):k.fn;
const kHow=k=>LANG==='en'?(k.how_en||k.how):k.how;
const kCmp=k=>LANG==='en'?(k.cmp_en||k.cmp):k.cmp;
const kNums=k=>LANG==='en'?(k.nums_en||k.nums):k.nums;
const kMis=k=>LANG==='en'?(k.mis_en||k.mis):k.mis;
const numM=n=>LANG==='en'?(n.m_en||n.m):n.m;
const numN=n=>LANG==='en'?(n.n_en||n.n):n.n;
const recogA=r=>LANG==='en'?(r.a_en||r.a):r.a;
const recogC=r=>LANG==='en'?(r.cue_en||r.cue):r.cue;
const fName=f=>LANG==='en'?(f.name_en||f.name):f.name;
const fFormula=f=>LANG==='en'?(f.formula_en||f.formula):f.formula;
/* ============================================================
每個知識點一張卡
欄位說明:
- id: 唯一英文ID（題目用 kp 欄位關聯）
- cat: 所屬分類ID（對應 CATS）
- term: 英文術語
- zh: 中文名稱
- def/def_en: 定義（中文/英文）
- fn/fn_en: 作用（中文/英文）
- how/how_en: 運作方式（中文/英文）
- cmp/cmp_en: 區別/易混淆（中文/英文）
- nums: 必背要點陣列（中文）
- nums_en: 必背要點陣列（英文）
- mis/mis_en: 常見陷阱陣列（中文/英文）
============================================================ */
const KPS=[
{id:"sample_kp1",cat:"cat1",term:"Sample Term One",zh:"範例術語一",
def:"這是第一個範例知識點的中文定義。",def_en:"This is the English definition of the first sample knowledge point.",
fn:"這是它的作用說明。",fn_en:"This is its function description.",
how:"這是它的運作方式說明。",how_en:"This is how it works.",
cmp:"這是它與相似概念的區別。",cmp_en:"This is how it differs from similar concepts.",
nums:["要點一：重要數字或事實"],nums_en:["Key fact one: important number or fact"],
mis:["陷阱一：常見誤解"],mis_en:["Trap one: common misconception"]},
{id:"sample_kp2",cat:"cat1",term:"Sample Term Two",zh:"範例術語二",
def:"第二個範例知識點的定義。",def_en:"Definition of the second sample knowledge point.",
fn:"作用說明。",fn_en:"Function description.",
how:"運作方式。",how_en:"How it works.",
cmp:"區別說明。",cmp_en:"Distinction.",
nums:[],nums_en:[],
mis:[],mis_en:[]},
{id:"sample_kp3",cat:"cat2",term:"Sample Term Three",zh:"範例術語三",
def:"第三個範例知識點的定義。",def_en:"Definition of the third sample knowledge point.",
fn:"作用說明。",fn_en:"Function description.",
how:"運作方式。",how_en:"How it works.",
cmp:"區別說明。",cmp_en:"Distinction.",
nums:[],nums_en:[],
mis:[],mis_en:[]},
];
/* ============ 題庫 ============
t: mc 選擇 / tf 是非 / match 配對 / order 排序 / short 簡答 / calc 計算 / scen 情境 */
/* ============================================================

t: "mc" 選擇題 / "tf" 是非題
選擇題欄位:
- id: 唯一ID | cat: 分類ID | kp: 知識點ID | t:"mc"
- q: 題目（中文，可被 EN 覆蓋為英文）
- opts: 選項陣列 | a: 正確答案索引（0起）
- oe: 每個選項的專屬解析陣列（與 opts 一一對應）
- exp: 整體解析 | cc: 易混淆提醒 | dif: 難度1-3 | keys: 關鍵字陣列
是非題欄位:
- t:"tf", a: true/false（不需 opts/oe）
============================================================ */
let QUESTIONS=[
{id:"q1",cat:"cat1",kp:"sample_kp1",t:"mc",q:"以下哪個是範例術語一的正確描述？",opts:["錯誤選項A","正確選項B","錯誤選項C","錯誤選項D"],a:1,oe:["選項A錯誤的原因說明","正確：選項B正確的原因","選項C錯誤的原因說明","選項D錯誤的原因說明"],exp:"整體解析：為什麼答案是B。",cc:"易混淆提醒：注意A和B的區別。",dif:1,keys:["關鍵字一"]},
{id:"q2",cat:"cat1",kp:"sample_kp1",t:"mc",q:"關於範例術語一，下列何者正確？",opts:["正確選項A","錯誤選項B","錯誤選項C","錯誤選項D"],a:0,oe:["正確：選項A正確的原因","選項B錯誤的原因","選項C錯誤的原因","選項D錯誤的原因"],exp:"整體解析。",cc:"易混淆提醒。",dif:2,keys:["關鍵字二"]},
{id:"q3",cat:"cat1",kp:"sample_kp2",t:"tf",q:"範例術語二的作用是XXX。",a:true,exp:"解析：為什麼是對的。",cc:"易混淆提醒。",dif:1,keys:["關鍵字三"]},
{id:"q4",cat:"cat2",kp:"sample_kp3",t:"mc",q:"範例術語三與範例術語一的主要區別是？",opts:["錯誤選項A","錯誤選項B","正確選項C","錯誤選項D"],a:2,oe:["選項A錯誤原因","選項B錯誤原因","正確：選項C正確原因","選項D錯誤原因"],exp:"整體解析。",cc:"易混淆提醒。",dif:2,keys:["關鍵字四"]},
{id:"q5",cat:"cat2",kp:"sample_kp3",t:"tf",q:"範例術語三屬於分類一。",a:false,exp:"解析：它屬於分類二，不是分類一。",cc:"注意分類不要搞混。",dif:1,keys:["關鍵字五"]},
{id:"q6",cat:"cat2",kp:"sample_kp3",t:"mc",q:"以下哪個關鍵字與範例術語三相關？",opts:["錯誤A","錯誤B","錯誤C","正確D"],a:3,oe:["A錯誤原因","B錯誤原因","C錯誤原因","正確：D正確原因"],exp:"整體解析。",cc:"易混淆提醒。",dif:3,keys:["關鍵字六"]},
];
/* ============================================================
題目預設顯示英文，此處提供英文版
格式: EN["題目id"]={q:"English question",o:["opt1","opt2",...],
e:"English explanation",c:"English confusion note",
k:["keyword1"],w:["oe1","oe2",...]}
若某題無英文版，則顯示中文原文
============================================================ */
const EN={};
EN["q1"]={q:"Which of the following correctly describes Sample Term One?",o:["Wrong option A","Correct option B","Wrong option C","Wrong option D"],e:"Explanation: why B is correct.",c:"Confusion note: watch the difference between A and B.",k:["keyword one"],w:["Why option A is wrong","Correct: why option B is right","Why option C is wrong","Why option D is wrong"]};
EN["q2"]={q:"Regarding Sample Term One, which is correct?",o:["Correct option A","Wrong option B","Wrong option C","Wrong option D"],e:"Overall explanation.",c:"Confusion note.",k:["keyword two"],w:["Correct: why A is right","Why B is wrong","Why C is wrong","Why D is wrong"]};
EN["q3"]={q:"The function of Sample Term Two is XXX.",e:"Explanation: why this is true.",c:"Confusion note.",k:["keyword three"]};
EN["q4"]={q:"What is the main difference between Sample Term Three and Sample Term One?",o:["Wrong A","Wrong B","Correct C","Wrong D"],e:"Overall explanation.",c:"Confusion note.",k:["keyword four"],w:["Why A is wrong","Why B is wrong","Correct: why C is right","Why D is wrong"]};
EN["q5"]={q:"Sample Term Three belongs to Category One.",e:"Explanation: it belongs to Category Two.",c:"Don't mix up categories.",k:["keyword five"]};
EN["q6"]={q:"Which keyword is related to Sample Term Three?",o:["Wrong A","Wrong B","Wrong C","Correct D"],e:"Overall explanation.",c:"Confusion note.",k:["keyword six"],w:["Why A wrong","Why B wrong","Why C wrong","Correct: why D right"]};
const ZHMAP={};
QUESTIONS.forEach(q=>{ZHMAP[q.id]={q:q.q,opts:q.opts};});
let LANG='en',QUESTIONS_RAW=null;
function applyLang(){
  // 題目永遠預設英文（LANG 只控制 UI 語言）；中文模式下每題可用按鈕展開中文
  QUESTIONS=QUESTIONS_RAW.map(r=>{
    if(r.en){
      const n=Object.assign({},r),e=r.en;
      if(e.q)n.q=e.q;if(e.opts)n.opts=e.opts;if(e.exp)n.exp=e.exp;
      if(e.cc)n.cc=e.cc;if(e.keys)n.keys=e.keys;
      if(e.pairs)n.pairs=e.pairs;if(e.items)n.items=e.items;if(e.oe)n.oe=e.oe;
      return n;
    }
    return Object.assign({},r);
  });
}

function qNow(){return (ST.adaptive&&ST.adaptive.questionsAnswered)||0;}
function migrate(){
  if(ST.v>=DATA_V)return;
  ST.adaptive=ST.adaptive||{questionsAnswered:0};
  for(const id in ST.q){const s=ST.q[id];
    if(s.cc==null)s.cc=0;if(s.cw==null)s.cw=0;if(s.lastR===undefined)s.lastR=null;
    if(s.conf===undefined)s.conf=null;if(s.rt===undefined)s.rt=null;
    if(s.rtN==null)s.rtN=0;if(s.rtSum==null)s.rtSum=0;
    if(s.sel===undefined)s.sel=null;if(s.dist==null)s.dist={};
    if(s.errT===undefined)s.errT=null;if(s.revC==null)s.revC=0;
    if(s.revDue===undefined)s.revDue=null;if(s.guessC==null)s.guessC=0;if(s.hiW==null)s.hiW=0;}
  for(const id in ST.kp){const s=ST.kp[id];
    if(s.types==null)s.types={};if(s.guessC==null)s.guessC=0;
    if(s.hiConfW==null)s.hiConfW=0;if(s.kBoost===undefined)s.kBoost=null;}
  if(!ST.adaptive.questionsAnswered){let t=0;for(const id in ST.q)t+=(ST.q[id].n||0);ST.adaptive.questionsAnswered=t;}
  ST.v=DATA_V;saveLocal();
}
/* 排程下一次複習：以全域答題數為間隔 */
function scheduleReview(q,correct){
  const s=qS(q.id),now=qNow();
  s.revC=(s.revC||0)+1;
  let iv;
  if(!correct){iv=REVIEW_INTERVALS.wrong;}
  else{const ladder=[REVIEW_INTERVALS.correctAfterWrong,REVIEW_INTERVALS.secondCorrect,REVIEW_INTERVALS.thirdCorrect,REVIEW_INTERVALS.fourthCorrect,REVIEW_INTERVALS.fifthCorrect];
    iv=ladder[Math.min(Math.max(s.cc,1),5)-1];}
  s.revDue=now+iv;
}
function trailCount(kpId,val){const r=(ST.kp[kpId]||{}).recent||[];let c=0;for(let i=r.length-1;i>=0&&r[i]===val;i--)c++;return c;}
/* Knowledge Point 掌握等級：Unknown→Exposure→Familiar→Understanding→Mastered */
function kpLevel(kpId){
  const s=ST.kp[kpId];
  if(!s||!s.n)return 'unknown';
  const acc=s.ok/s.n;
  const typesOk=Object.keys(s.types||{}).filter(t=>s.types[t].ok>0).length;
  const trail=trailCount(kpId,1);
  const mCount=kpMasteredCount(kpId),total=kpTotal(kpId);
  if(acc>=0.85&&trail>=3&&typesOk>=3&&total>0&&mCount===total&&(s.hiConfW||0)===0&&(s.guessC||0)===0)return 'mastered';
  if(acc>=0.7&&trail>=2&&typesOk>=2)return 'understanding';
  if(acc>=0.5)return 'familiar';
  return 'exposure';
}
function reviewDueCount(){let n=0;const now=qNow();for(const id in ST.q){const s=ST.q[id];if(s.revDue!=null&&now>=s.revDue)n++;}return n;}
/* 自適應選題權重 */
function qWeight(q){
  const s=qS(q.id),ks=kpS(q.kp),now=qNow();
  let w=10+Math.random()*8;
  if(s.revDue!=null&&now>=s.revDue){w+=500;w+=Math.min(120,(now-s.revDue)*3);}
  if(s.cw>0)w+=150*Math.min(s.cw,3);
  const lv=kpLevel(q.kp);
  if(lv==='unknown'){w+=(ks.n>0?150:80);}
  else if(lv==='exposure')w+=150;
  else if(lv==='familiar')w+=60;
  if(ks.mark==='unknown')w+=120;else if(ks.mark==='unsure')w+=60;
  if((ks.hiConfW||0)>0)w+=100;
  if((s.guessC||0)>0)w+=120;
  let md=0;for(const k in (s.dist||{}))md=Math.max(md,s.dist[k]);
  if(md>=2)w+=100;
  const tOk=Object.keys(ks.types||{}).filter(t=>ks.types[t].ok>0).length;
  if(ks.n>0&&tOk<2)w+=80;
  if(ks.kBoost!=null&&now<=ks.kBoost)w+=150;
  const k=kpById(q.kp),pres=(k&&k.pre)||[];
  if(pres.length&&lv!=='understanding'&&lv!=='mastered'&&pres.some(pid=>['unknown','exposure'].includes(kpLevel(pid))))w+=90;
  if(lv==='mastered')w=Math.max(5,w*0.15);
  return w;
}
/* 70% 自適應加權抽取 ＋ 30% 隨機（含已掌握題，確認穩定度） */
function pickAdaptive(pool,n){
  pool=(pool||[]).filter(Boolean);
  n=Math.min(n,pool.length);
  if(!pool.length)return [];
  const scored=pool.map(q=>({q,w:qWeight(q)}));
  const nA=Math.max(1,Math.round(n*0.7));
  const cands=scored.slice().sort((a,b)=>b.w-a.w).slice(0,Math.min(scored.length,Math.max(nA*3,nA+5)));
  const picked=[],used=new Set();
  while(picked.length<nA&&cands.length){
    let tot=0;for(const c of cands)tot+=c.w;
    let r=Math.random()*tot,idx=0;
    while(idx<cands.length-1&&r>=cands[idx].w){r-=cands[idx].w;idx++;}
    const c=cands.splice(idx,1)[0];picked.push(c.q);used.add(c.q.id);
  }
  const rest=shuffle(scored.filter(c=>!used.has(c.q.id)));
  while(picked.length<n&&rest.length)picked.push(rest.pop().q);
  return shuffle(picked);
}
/* 學習建議：高信心錯誤 → 連續錯誤 → 低掌握 → 猜對 → 前置知識弱 → 到期複習 */
function recommendNext(n){
  n=n||3;
  const out=KPS.map(k=>{
    const s=kpS(k.id);let sc=0;const reasons=[];
    if((s.hiConfW||0)>0){sc+=300;reasons.push(LANG==="en"?`High-confidence mistakes × ${s.hiConfW} (possible misconception)`:`高信心答錯 ${s.hiConfW} 次（可能概念誤解）`);}
    const cw=trailCount(k.id,0);
    if(cw>=2){sc+=200;reasons.push(LANG==="en"?`Wrong ${cw} times in a row`:`連續答錯 ${cw} 次`);}
    const lv=kpLevel(k.id);
    if(s.n>0&&(lv==='unknown'||lv==='exposure')){sc+=120;reasons.push((LANG==="en"?"Mastery level: ":"掌握等級：")+kpLevelName(lv));}
    else if(lv==='familiar'){sc+=60;}
    if((s.guessC||0)>0){sc+=150;reasons.push(LANG==="en"?`Guessed right ${s.guessC} times, not yet stable`:`猜對 ${s.guessC} 次，尚未穩定掌握`);}
    const due=QUESTIONS.filter(q=>q.kp===k.id).filter(q=>{const qs=qS(q.id);return qs.revDue!=null&&qNow()>=qs.revDue;}).length;
    if(due>0){sc+=40*due;reasons.push(LANG==="en"?`${due} questions due for review`:`${due} 題到期可複習`);}
    return {k,sc,reasons,lv};
  }).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc);
  const res=out.slice(0,n);
  const seen=new Set(res.map(x=>x.k.id));
  for(const x of res){
    for(const pid of ((x.k.pre)||[])){
      if(seen.has(pid))continue;
      const pl=kpLevel(pid);
      if(pl==='unknown'||pl==='exposure'){const pk=kpById(pid);
        if(pk){res.push({k:pk,sc:x.sc+50,reasons:[LANG==="en"?`Prerequisite for "${x.k.term}" — strengthen the foundation first`:`「${x.k.term}」的前置知識，先補強底層`],lv:pl,pre:true});seen.add(pid);}}
    }
  }
  return res.sort((a,b)=>b.sc-a.sc).slice(0,n);
}
function relatedKps(kpId){
  const k=kpById(kpId);if(!k)return {pre:[],dep:[],same:[]};
  const pre=((k.pre)||[]).map(kpById).filter(Boolean);
  const dep=KPS.filter(x=>((x.pre)||[]).includes(kpId));
  const skip=new Set([kpId,...pre.map(x=>x.id),...dep.map(x=>x.id)]);
  const same=KPS.filter(x=>x.cat===k.cat&&!skip.has(x.id)).slice(0,6);
  return {pre,dep,same};
}
function setErrT(qid,v){qS(qid).errT=v||null;save();toast(v?(T("已記錄：")+errTypeZh(v)):T("已清除錯誤類型"));}
function profileData(){
  const att=KPS.filter(k=>{const s=ST.kp[k.id];return s&&s.n>0;});
  const byLv=(a,b)=>(KP_LEVEL_RANK[kpLevel(b.id)]-KP_LEVEL_RANK[kpLevel(a.id)])||((mastery(b.id)||0)-(mastery(a.id)||0));
  const strong=att.slice().sort(byLv).slice(0,3);
  const weak=att.slice().sort((a,b)=>-byLv(a,b)).slice(0,3);
  const errC={};let errT=0;
  for(const id in ST.q){const e=ST.q[id].errT;if(e){errC[e]=(errC[e]||0)+1;errT++;}}
  const errTop=Object.entries(errC).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const hiC=KPS.filter(k=>(kpS(k.id).hiConfW||0)>0).sort((a,b)=>kpS(b.id).hiConfW-kpS(a.id).hiConfW).slice(0,3);
  const guess=KPS.filter(k=>(kpS(k.id).guessC||0)>0).sort((a,b)=>kpS(b.id).guessC-kpS(a.id).guessC).slice(0,3);
  return {strong,weak,errTop,errT,hiC,guess,due:reviewDueCount(),attN:att.length};
}

function whyWrong(q,res){
  const kp=kpById(q.kp),parts=[];
  if((q.t==='mc'||q.t==='scen')&&res.ans!=null&&res.ans!==q.a&&q.opts[res.ans]!=null){
    parts.push(`你選了「${q.opts[res.ans]}」。`);
    if(q.oe&&q.oe[res.ans])parts.push(q.oe[res.ans]);
    const d=((qS(q.id).dist||{})[res.ans])||0;
    if(d>=2)parts.push(`注意：你已經 ${d} 次選擇這個錯誤選項，這可能是一個穩定的錯誤概念，建議重讀「${kp.term}」知識卡。`);
  }
  parts.push(`這題真正考的是「${kp.term}（${kp.zh}）」。`);
  if(res.conf==='sure')parts.push('你當時很有把握卻答錯，這通常代表概念誤解，系統會優先安排相關複習。');
  else if(res.conf==='guess')parts.push('這題你是猜的，之後系統會再次測試確認是否真的掌握。');
  return parts.join(' ');
}
function optExplain(q,res){
  return q.opts.map((o,i)=>{
    const ok=i===q.a,mine=res.ans===i;
    const onote=(q.oe&&q.oe[i])?q.oe[i]:null;
    const note=ok?`<span style="color:var(--ok)">✓ 正確：</span>${esc(onote||q.exp)}`
      :(mine?`<span style="color:var(--bad)">✗ 你的選擇：</span>${esc(onote||'見上方「為什麼你的答案錯了」。')}`
      :('✗'+(onote?` ${esc(onote)}`:'')));
    return `<div class="kv"><span>${ok?'✓':'✗'} ${esc(o)}${mine?'（你的選擇）':''}</span><span class="muted small" style="max-width:60%">${note}</span></div>`;
  }).join('');
}

function save(){saveLocal();scheduleFolderSync();}
function saveLocal(){try{ST.savedAt=Date.now();ST.lang=LANG;if(ST.sessions.length>60)ST.sessions=ST.sessions.slice(-60);localStorage.setItem(LS,JSON.stringify(ST));}catch(e){}}
let _syncT=null;
function scheduleFolderSync(){clearTimeout(_syncT);_syncT=setTimeout(syncToFolder,800);}
function kpS(id){if(!ST.kp[id])ST.kp[id]={n:0,ok:0,recent:[],mark:null,types:{},guessC:0,hiConfW:0,kBoost:null};return ST.kp[id];}
function qS(id){if(!ST.q[id])ST.q[id]={n:0,ok:0,wrong:0,lastUser:"",cc:0,cw:0,lastR:null,conf:null,rt:null,rtN:0,rtSum:0,sel:null,dist:{},errT:null,revC:0,revDue:null,guessC:0,hiW:0};return ST.q[id];}
/* 掌握度 = 已掌握題數 / 題庫總題數（純統計，不憑空給分）
   - 一題只要答對過一次就算「已掌握」該題；公式訓練也計入其知識點
   - 例：某知識點共 5 題，掌握 1 題 → 1/5 = 20%
   - 自我標記（會/不熟/不會）只影響出題順序，不影響百分比 */
function kpTotal(kpId){
  let n=0;
  for(const q of QUESTIONS)if(q.kp===kpId)n++;
  for(const f of FORMULAS)if(f.kp===kpId)n++;
  return n;
}
function kpMasteredCount(kpId){
  let m=0;
  for(const q of QUESTIONS)if(q.kp===kpId){const s=ST.q[q.id];if(s&&s.ok>0)m++;}
  for(const f of FORMULAS)if(f.kp===kpId){const s=ST.q['formula_'+f.id];if(s&&s.ok>0)m++;}
  return m;
}
function mastery(kpId){
  const t=kpTotal(kpId);
  if(t===0)return null;
  return Math.round(100*kpMasteredCount(kpId)/t);
}
function bankTotal(){return QUESTIONS.length+FORMULAS.length;}
function bankMastered(){let m=0;for(const id in ST.q)if(ST.q[id].ok>0)m++;return m;}
function kpPriority(kpId){
  const s=kpS(kpId);let p=0;
  if(s.mark==="unknown")p+=1000;else if(s.mark==="unsure")p+=700;
  if(s.recent.length&&s.recent[s.recent.length-1]===0)p+=500;
  const m=mastery(kpId);p+=(100-(m==null?50:m))*3;
  return p+Math.random()*60;
}
function qPriority(q){
  let p=kpPriority(q.kp);const s=qS(q.id);p+=s.wrong*80;return p+Math.random()*20;
}
function recordAnswer(q,correct,userAns,opts){
  opts=opts||{};
  const qs=qS(q.id);qs.n++;if(correct)qs.ok++;else{qs.wrong++;qs.lastUser=userAns==null?"":String(userAns).slice(0,120);}
  const ks=kpS(q.kp);ks.n++;if(correct)ks.ok++;ks.recent.push(correct?1:0);if(ks.recent.length>10)ks.recent.shift();
  ST.adaptive=ST.adaptive||{questionsAnswered:0};
  ST.adaptive.questionsAnswered++;
  if(opts.adaptive===false){save();return;}
  if(correct){qs.cc=(qs.cc||0)+1;qs.cw=0;}else{qs.cw=(qs.cw||0)+1;qs.cc=0;}
  qs.lastR=correct?1:0;
  const conf=opts.conf||null;qs.conf=conf;
  if(correct&&conf==='guess'){qs.guessC=(qs.guessC||0)+1;ks.guessC=(ks.guessC||0)+1;}
  if(!correct&&conf==='sure'){qs.hiW=(qs.hiW||0)+1;ks.hiConfW=(ks.hiConfW||0)+1;}
  if(opts.rt!=null){qs.rt=opts.rt;qs.rtN=(qs.rtN||0)+1;qs.rtSum=(qs.rtSum||0)+opts.rt;}
  const sel=(opts.sel==null?null:opts.sel);qs.sel=sel;
  if(!correct&&sel!=null&&(q.t==='mc'||q.t==='scen')){qs.dist=qs.dist||{};qs.dist[sel]=(qs.dist[sel]||0)+1;}
  const tp=ks.types[q.t]=ks.types[q.t]||{n:0,ok:0};tp.n++;if(correct)tp.ok++;
  if(!correct)ks.kBoost=qNow()+15;
  scheduleReview(q,correct);
  save();
}
function kpById(id){return KPS.find(k=>k.id===id);}
function qById(id){return QUESTIONS.find(q=>q.id===id);}
function wrongCountKp(kpId){const s=ST.kp[kpId];return s?s.n-s.ok:0;}

/* ============ 本地記憶資料夾 ============
   進度除了瀏覽器 localStorage，也可同步到使用者電腦的資料夾：
   <選擇的位置>/HVAC123記憶資料/progress.json（handle 存 IndexedDB） */
const MEMDB='hvac123mem',MEMKEY='memdir',MEMFOLDER='HVAC123記憶資料',MEMFILE='progress.json';
let MEM={dir:null,status:'none',lastSync:null};
const memSupported=()=>typeof window.showDirectoryPicker==='function';
function idbOpen(){return new Promise((res,rej)=>{try{const r=indexedDB.open(MEMDB,1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
async function idbGet(k){try{const db=await idbOpen();return await new Promise((res,rej)=>{const t=db.transaction('s').objectStore('s').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});}catch(e){return null;}}
async function idbSet(k,v){const db=await idbOpen();return await new Promise((res,rej)=>{const t=db.transaction('s','readwrite').objectStore('s').put(v,k);t.onsuccess=()=>res();t.onerror=()=>rej(t.error);});}
async function idbDel(k){try{const db=await idbOpen();await new Promise((res,rej)=>{const t=db.transaction('s','readwrite').objectStore('s').delete(k);t.onsuccess=()=>res();t.onerror=()=>rej(t.error);});}catch(e){}}
async function syncToFolder(force){
  if(!MEM.dir)return;
  try{
    if(await MEM.dir.queryPermission({mode:'readwrite'})!=='granted'){if(force)toast('需要重新授權才能寫入');return;}
    const fh=await MEM.dir.getFileHandle(MEMFILE,{create:true});
    const w=await fh.createWritable();await w.write(JSON.stringify(ST));await w.close();
    MEM.lastSync=new Date();MEM.status='ready';
  }catch(e){MEM.status='error';}
  renderMemCard();
}
async function readFolderFile(){
  try{
    const fh=await MEM.dir.getFileHandle(MEMFILE);
    const txt=await (await fh.getFile()).text();
    const data=JSON.parse(txt);
    if(data&&data.kp&&(data.savedAt||0)>(ST.savedAt||0)){ST=data;saveLocal();render();}
    MEM.status='ready';MEM.lastSync=new Date();
  }catch(e){
    if(e&&e.name==='NotFoundError'){await syncToFolder();}
    else MEM.status='error';
  }
  renderMemCard();
}
async function setupMemoryFolder(){
  if(!memSupported()){toast('此瀏覽器不支援資料夾存取，請用匯出/匯入');return;}
  try{
    const parent=await window.showDirectoryPicker({mode:'readwrite'});
    const dir=await parent.getDirectoryHandle(MEMFOLDER,{create:true});
    if(await dir.requestPermission({mode:'readwrite'})!=='granted'){toast('未取得授權');return;}
    MEM.dir=dir;await idbSet(MEMKEY,dir);
    await syncToFolder(true);toast('記憶資料夾已設定');
  }catch(e){if(!e||e.name!=='AbortError')toast('設定失敗');}
  renderMemCard();
}
async function reconnectFolder(){
  if(!MEM.dir)return;
  try{
    if(await MEM.dir.requestPermission({mode:'readwrite'})==='granted'){await readFolderFile();}
    else toast('未取得授權');
  }catch(e){toast('重新連接失敗');}
  renderMemCard();
}
async function disconnectFolder(){await idbDel(MEMKEY);MEM.dir=null;MEM.status='none';renderMemCard();toast('已中斷連接（資料夾內的檔案會保留）');}
function exportJSON(){
  const blob=new Blob([JSON.stringify(ST,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='hvac123-progress.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast(T("已匯出進度檔"));
}
function importJSON(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(d&&d.kp){ST=d;save();render();toast('已匯入進度');}else toast('檔案格式不正確');
  }catch(e){toast('檔案讀取失敗');}};
  r.readAsText(file);
}
function memStatusText(){
  if(!memSupported())return ['na','此瀏覽器不支援資料夾存取，可用下方的匯出/匯入備份進度。'];
  if(MEM.status==='ready'){
    let t='已連接';
    if(MEM.lastSync)t+='（上次同步 '+MEM.lastSync.toLocaleString()+')';
    return ['ok',t];
  }
  if(MEM.status==='need-auth')return ['warn','需要重新授權（瀏覽器要求每次開啟後確認一次）。'];
  if(MEM.status==='error')return ['bad','同步發生錯誤，請重新連接。'];
  return ['na','尚未設定。'];
}

function renderMemCard(){
  const el=$("#memcard");if(!el)return;
  const [cls,txt]=memStatusText();
  const dot=cls==='ok'?'🟢':cls==='warn'?'🟡':cls==='bad'?'🔴':'⚪';
  el.innerHTML=`<div class="kv"><span>狀態</span><b>${dot} ${esc(txt)}</b></div>
  <p class="muted small">設定後，網站會在你選的位置建立 <b>${MEMFOLDER}</b> 資料夾，進度自動存成 <b>${MEMFILE}</b>。下次打開這個 HTML 會自動找回；換電腦時把整個資料夾帶走即可。</p>
  <div class="rowbtns">
    ${memSupported()?`<button class="btn sm" onclick="setupMemoryFolder()">設定記憶資料夾</button>`:""}
    ${MEM.dir?`<button class="btn sm ghost" onclick="reconnectFolder()">重新連接</button><button class="btn sm danger" onclick="disconnectFolder()">中斷連接</button>`:""}
    <button class="btn sm ghost" onclick="exportJSON()">匯出進度檔</button>
    <button class="btn sm ghost" onclick="document.getElementById('impfile').click()">匯入進度檔</button>
    <input type="file" id="impfile" accept=".json,application/json" style="display:none" onchange="importJSON(this.files[0]);this.value=''">
  </div>`;
}
async function initMemory(){
  renderMemCard();
  if(!memSupported())return;
  const h=await idbGet(MEMKEY);
  if(!h)return;
  MEM.dir=h;
  try{
    if(await h.queryPermission({mode:'read'})==='granted'){await readFolderFile();}
    else{MEM.status='need-auth';renderMemCard();}
  }catch(e){MEM.status='error';renderMemCard();}
}

let STD=null;
function vStudy(M){

  if(STD.idx>=STD.order.length)STD.idx=0;
  const k=list[STD.order[STD.idx]],s=kpS(k.id),m=mastery(k.id);
  const rel=relatedKps(k.id),lv=kpLevel(k.id);
  const kps=STD.cat==="all"?KPS:KPS.filter(x=>x.cat===STD.cat);
  M.innerHTML=`<div class="card"><h2>${T("學習模式")}</h2>

const SELMAP={};let WCTX={mode:"prac"};let CURQ=null;
const norm=s=>String(s||"").toLowerCase().trim().replace(/\s+/g," ").replace(/[。．.]+$/,"");
function correctText(q){
  if(q.t==="mc"||q.t==="scen")return q.opts[q.a];
  if(q.t==="tf")return q.a?"是（True）":"否（False）";
  if(q.t==="match")return q.pairs.map(p=>p[0]+" → "+p[1]).join("；");
  if(q.t==="order")return q.items.join(" → ");
  if(q.t==="short")return q.acc[0];
  if(q.t==="calc")return q.acc[0]+(q.unit?" "+q.unit:"");
  return "";
}
const typeName=t=>LANG==='en'?({mc:"Multiple Choice",tf:"True/False"}[t]||t):({mc:"選擇題",tf:"是非題"}[t]||t);
let ORDERMAP={};
function qBody(q,sid,saved){
  if(saved!==undefined&&saved!==null&&(q.t==="mc"||q.t==="scen"||q.t==="tf"))SELMAP[sid]=saved;
  const confRow=(WCTX.mode==="prac")?`<div class="confrow" id="${sid}_conf"><span class="muted small">答題信心：</span>${Object.keys(CONF_LABEL).map(c=>`<button class="btn sm ghost" onclick="pickConf('${sid}','${c}',this)">${CONF_LABEL[c]}</button>`).join("")}</div>`:"";
  const fav=ST.fav&&ST.fav[q.id];
  const qs=qS(q.id),att=qs.n||0,acc=att?(qs.ok/att):null;
  const diff=acc===null?"":acc>=0.8?` <span class="pill k">${T("簡單")}</span>`:acc>=0.5?` <span class="pill u">${T("中等")}</span>`:` <span class="pill x">${T("困難")}</span>`;
  const meta=`<div class="qmeta">${typeName(q.t)} · ${catName(q.cat)} · ${esc(kpName(kpById(q.kp)))}${diff} <button class="btn sm ghost" onclick="toggleFav('${q.id}')" title="${T("收藏")}">${fav?"★":"☆"}</button></div><div class="big-q">${esc(q.q)}</div>${LANG==='en'?"":`<button class="btn sm ghost" onclick="toggleZh('${sid}','${q.id}',this)" style="margin:6px 0">${T("中文翻譯")}</button><div id="${sid}_zh" class="note" style="display:none;margin:8px 0"></div>`}${confRow}`;
  if(q.t==="mc"||q.t==="scen"){
    if(!ORDERMAP[sid])ORDERMAP[sid]=shuffle(q.opts.map((o,i)=>i));
    const ord=ORDERMAP[sid];
    return meta+ord.map(oi=>`<button class="opt ${saved===oi?"sel":""}" onclick="pickOpt('${sid}',${oi},this)">${esc(q.opts[oi])}</button>`).join("")+
      (WCTX.mode==="prac"?`<div class="rowbtns"><button class="btn" onclick="submitChoice('${sid}')">提交答案</button></div>`:"");
  }
  if(q.t==="tf"){
    return meta+`<button class="opt ${saved===true?"sel":""}" onclick="pickTF('${sid}',true,this)">是（True）</button>
    <button class="opt ${saved===false?"sel":""}" onclick="pickTF('${sid}',false,this)">否（False）</button>`+
      (WCTX.mode==="prac"?`<div class="rowbtns"><button class="btn" onclick="submitChoice('${sid}')">提交答案</button></div>`:"");
  }
  return meta;
}
function collectAns(q,sid){
  const v=SELMAP[sid];return v==null?null:v;
}
function gradeQ(q,ans){
  let correct=false,uText="";
  if(q.t==="mc"){correct=ans===q.a;uText=ans==null?T("（未作答）"):q.opts[ans];}
  else if(q.t==="tf"){correct=ans===q.a;uText=ans==null?T("（未作答）"):ans?(LANG==="en"?"True":"是（True）"):(LANG==="en"?"False":"否（False）");}
  return {correct,uText};
}
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.target.tagName==="SELECT")return;
  const k=e.key.toLowerCase();
  // 練習/考試模式：1-4/a-d 選答案，Enter 提交
  // 練習模式
  if(CUR==="practice"&&typeof PRAC!=="undefined"&&PRAC&&PRAC.qs){
    const q=PRAC.qs[PRAC.idx];if(!q)return;
    const sid="p"+PRAC.idx;
    let idx=-1;
    if(k>="1"&&k<="4")idx=parseInt(k)-1;
    else if(k>="a"&&k<="d")idx=k.charCodeAt(0)-97;
    if(idx>=0){
      const btns=$$(`#qb_${sid} .opt`);
      if(btns[idx]){btns[idx].click();e.preventDefault();}
    }else if(k==="enter"){
      const btns=$$(`#qb_${sid} .btn`);
      const sb=btns.find(b=>b.textContent.includes("提交")||b.textContent.includes("Submit"));
      if(sb)sb.click();
    }
  }
  // 考試模式：1-4/a-d 選答案
  else if(CUR==="exam"&&typeof EXAM!=="undefined"&&EXAM&&EXAM.qs&&!EXAM.done){
    const q=EXAM.qs[EXAM.idx];if(!q)return;
    const sid="e"+EXAM.idx;
    let idx=-1;
    if(k>="1"&&k<="4")idx=parseInt(k)-1;
    else if(k>="a"&&k<="d")idx=k.charCodeAt(0)-97;
    if(idx>=0){
      const btns=$$(`#qb_${sid} .opt`);
      if(btns[idx]){btns[idx].click();e.preventDefault();}
    }
  }
});
function pickOpt(sid,oi,el){

function startPractice(cat,kp,n,mode){
  const favOnly=($("#pr_fav")&&$("#pr_fav").value==="fav");

function gradePrac(ans){
  const q=PRAC_Q,res=gradeQ(q,ans);
  const sid="p"+PRAC.idx;

let EXAM=null;
function vExam(M){

}
function vExamSetup(M){

  <p class="muted">${T("作答時不顯示答案；題目與選項順序皆隨機。交卷後才顯示成績、錯題與弱點知識點。")}</p>

    const snap={cnt:{},qw:{}};KPS.forEach(k=>snap.cnt[k.id]=kpMasteredCount(k.id));pool.slice(0,n).forEach(q=>snap.qw[q.id]=qS(q.id).wrong);

function renderEQ(M){

  const dots=EXAM.qs.map((x,i)=>`<button class="btn sm ${EXAM.ans[x.id]!=null?"":"ghost"}" style="min-width:44px" onclick="eqGo(${i})">${i+1}</button>`).join("");
  M.innerHTML=`<div class="card"><h2>模擬考</h2><div class="stepdots">第 ${EXAM.idx+1} / ${EXAM.qs.length} 題 · 已作答 ${Object.keys(EXAM.ans).length}</div>
  <div id="qb_${sid}">${qBody(q,sid,saved)}</div>
  <div class="rowbtns"><button class="btn ghost" id="eq_prev" ${EXAM.idx===0?"disabled":""}>← 上一題</button>
  <button class="btn ghost" id="eq_next" ${EXAM.idx===EXAM.qs.length-1?"disabled":""}>下一題 →</button>

  $("#eq_next").onclick=()=>{saveExamPage();EXAM.idx++;render();};

}
function saveExamPage(){
  const q=EXAM.qs[EXAM.idx],sid="e"+EXAM.idx;
  const a=collectAns(q,sid);
  const empty=a==null||a===""||(typeof a==="object"&&!Array.isArray(a)&&Object.values(a).every(v=>!v))||(Array.isArray(a)&&!a.length);
  if(!empty)EXAM.ans[q.id]=a;else delete EXAM.ans[q.id];
}
function eqGo(i){saveExamPage();EXAM.idx=i;render();}
function gradeExam(){
  EXAM.results=EXAM.qs.map(q=>{const ans=EXAM.ans[q.id];const r=gradeQ(q,ans==null?null:ans);
    recordAnswer(q,r.correct,r.uText,{adaptive:false});return {q,correct:r.correct,uText:r.uText,ans,det:r.det};});
  EXAM.review=true;render();
}
function vExamReview(M){

  <div class="card"><button class="btn ghost" id="ex_all_btn">${T("顯示全部題目回顧")}</button><div id="ex_all" style="display:none;margin-top:10px"></div></div>

}

    <div class="flip" id="rc_${i}"><b>${esc(recogC(r))}</b><span class="hint">${T("（點此翻面）")}</span>
    <div class="ans"><b>${esc(recogA(r))}</b><div class="rowbtns"><button class="btn sm ghost" onclick="event.stopPropagation();go('study',{kp:'${r.kp}'})">${T("看知識卡")}</button></div></div></div>`).join("")}</div>`;
  RECOG.forEach((r,i)=>{$(`#rc_${i}`).onclick=e=>{if(e.target.tagName!=="BUTTON")$(`#rc_${i}`).classList.toggle("open");};});
  $("#rc_go").onclick=()=>{RECQ={qs:shuffle(RECOG).slice(0,10),idx:0,ok:0};render();};
  $("#rc_f").oninput=e=>{const v=e.target.value.toLowerCase();RECOG.forEach((r,i)=>{const el=$("#rc_"+i);if(el)el.style.display=recogC(r).toLowerCase().includes(v)?"":"none";});};
}
function vRecogQuiz(M){
  const r=RECQ.qs[RECQ.idx];
  const distract=shuffle(RECOG.filter(x=>x.a!==r.a)).slice(0,3).map(x=>recogA(x));
  const opts=shuffle([recogA(r)].concat(distract));
  M.innerHTML=`<div class="card"><h2>${T("快速辨認測驗")}</h2><div class="stepdots">${T("第")} ${RECQ.idx+1} / ${RECQ.qs.length} ${T("題")} · ${T("已對")} ${RECQ.ok}</div>
  <div class="big-q">${T("看到")} <b>${esc(recogC(r))}</b>${T("，想到？")}</div>
  <div id="rc_opts">${opts.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div><div id="rc_fb"></div>
  <div class="rowbtns" id="rc_nav" style="display:none"><button class="btn" id="rc_next">${RECQ.idx+1>=RECQ.qs.length?T("看結果"):T("下一題 →")}</button></div></div>`;
  $$("#rc_opts .opt").forEach(b=>b.onclick=()=>{
    $$("#rc_opts .opt").forEach(x=>x.disabled=true);
    const good=b.dataset.v===recogA(r);if(good){RECQ.ok++;b.classList.add("right");}else{b.classList.add("wrong");$$(`#rc_opts .opt`).find(x=>x.dataset.v===recogA(r)).classList.add("right");}
    $("#rc_fb").innerHTML=`<div class="fb ${good?"ok":"no"}"><h4>${good?T("✓ 答對了"):T("✗ 答錯了")}</h4><p><b>${esc(recogC(r))}</b> → <b>${esc(recogA(r))}</b></p>
    <div class="rowbtns"><button class="btn sm ghost" onclick="go('study',{kp:'${r.kp}'})">${T("看知識卡")}</button></div></div>`;
    $("#rc_nav").style.display="flex";
  });
  $("#rc_next").onclick=()=>{RECQ.idx++;if(RECQ.idx>=RECQ.qs.length){const s=Math.round(RECQ.ok/RECQ.qs.length*100);ST.sessions.push({d:nowStr(),mode:T("辨認測驗"),score:s,ok:RECQ.ok,total:RECQ.qs.length});save();RECQ=null;toast(`${T("得分")} ${s}%`);}render();};
}

/* ============ 啟動 ============ */
QUESTIONS_RAW=QUESTIONS;LANG=(ST&&ST.lang)||'en';applyLang();applyTheme();applyStaticLang();
(function(){const b=document.getElementById('langbtn');if(b)b.textContent=(LANG==='en'?'中文版':'English');})();
nav();render();initMemory();
</script>
